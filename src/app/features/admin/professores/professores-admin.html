<div class="min-h-[80vh] flex items-center justify-center p-4 md:p-8 animate-fade-in">
  <div class="w-full max-w-lg bg-white border border-slate-100 p-8 md:p-10 rounded-3xl shadow-[0_20px_50px_rgba(99,102,241,0.04)] hover:shadow-[0_20px_50px_rgba(99,102,241,0.06)] transition-all duration-300">
    
    <!-- Cabeçalho do Card -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-50 border border-indigo-100 shadow-sm mb-4">
        <i class="pi pi-user-plus text-indigo-600 text-2xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Convidar Professor</h1>
      <p class="text-slate-500 text-sm mt-2 max-w-sm mx-auto">
        Cadastre um novo docente no sistema. Ele receberá um convite por e-mail para configurar sua senha de acesso.
      </p>
    </div>

    <!-- Formulário -->
    <form [formGroup]="inviteForm" (ngSubmit)="enviarConvite()" class="flex flex-col gap-6">
      
      <!-- Nome -->
      <div class="flex flex-col gap-1.5">
        <p-float-label variant="on" class="block w-full">
          <input pInputText id="name" type="text" formControlName="name" class="w-full !py-3"
            [class.border-red-500]="inviteForm.get('name')?.invalid && inviteForm.get('name')?.touched" />
          <label for="name">Nome Completo</label>
        </p-float-label>
        <app-form-error [control]="inviteForm.get('name')"></app-form-error>
      </div>

      <!-- Email -->
      <div class="flex flex-col gap-1.5">
        <p-float-label variant="on" class="block w-full">
          <input pInputText id="email" type="email" formControlName="email" class="w-full !py-3"
            [class.border-red-500]="inviteForm.get('email')?.invalid && inviteForm.get('email')?.touched" />
          <label for="email">E-mail Docente</label>
        </p-float-label>
        <app-form-error [control]="inviteForm.get('email')"></app-form-error>
      </div>

      <!-- Botão Convidar -->
      <p-button label="Enviar Convite" type="submit" severity="primary" styleClass="w-full !py-3.5 font-bold shadow-sm hover:shadow-indigo-500/10 transition-all duration-200" [loading]="loading()"></p-button>
    </form>
  </div>
</div>
