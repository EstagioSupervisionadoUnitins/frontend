<div class="min-h-screen flex bg-slate-50">

    <div class="hidden lg:flex lg:w-1/2 bg-blue-50 items-center justify-center p-12">
        <div class="max-w-lg text-center">
            <img src="assets/login.svg" alt="">
            <h2 class="mt-8 text-3xl font-bold text-slate-800">Nova Senha</h2>
            <p class="mt-4 text-slate-600 leading-relaxed">
                Crie uma nova senha forte e segura para voltar a acessar sua conta.
            </p>
        </div>
    </div>

    <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12">
        <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl shadow-sm border border-slate-100">

            @if (!resetSucesso()) {
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Redefinir Senha</h1>
                <p class="text-slate-500">Informe o código recebido por e-mail e sua nova senha.</p>
            </div>

            <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()" class="flex flex-col gap-5">

                <div class="flex flex-col gap-2">
                    <p-float-label variant="on">
                        <input pInputText id="token" type="text" formControlName="token" class="w-full"
                            [class.border-red-500]="resetPasswordForm.get('token')?.invalid && resetPasswordForm.get('token')?.touched" />
                        <label for="token">Código de recuperação (Token)</label>
                    </p-float-label>
                </div>

                <div class="flex flex-col gap-2">
                    <p-float-label variant="on">
                        <p-password id="newPassword" formControlName="newPassword" [feedback]="true" [toggleMask]="true"
                            styleClass="w-full" inputId="newPassword" promptLabel="Sua nova senha" weakLabel="Fraca" mediumLabel="Média" strongLabel="Forte"
                            [inputStyleClass]="'w-full ' + (resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched ? 'border-red-500' : '')" />
                        <label for="newPassword">Nova Senha</label>
                    </p-float-label>
                </div>

                <p-button label="Redefinir Senha" type="submit" severity="primary" styleClass="w-full mt-4 !py-3" [loading]="loading()"></p-button>

                <div class="flex items-center justify-center mt-1">
                    <a routerLink="/login" class="text-sm font-semibold text-slate-600 hover:text-slate-800 transition-colors">
                        Voltar ao login
                    </a>
                </div>

            </form>
            } @else {
            <div class="mb-8 text-center flex flex-col items-center">
                <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-6 text-2xl">
                    ✅
                </div>
                <h1 class="text-3xl font-bold text-slate-900 mb-4">Senha redefinida!</h1>
                <p class="text-slate-500 leading-relaxed mb-8">
                    Sua senha foi redefinida com sucesso. Redirecionando para o login...
                </p>
                <p-button label="Ir para login" routerLink="/login" severity="primary" styleClass="w-full !py-3"></p-button>
            </div>
            }
        </div>
    </div>

</div>
