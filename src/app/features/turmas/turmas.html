<div class="container mx-auto p-4 animate-fade-in">
  <p-toast></p-toast>

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-surface-900">Gerenciar Minhas Turmas</h1>
    <p-button label="Nova Turma" icon="pi pi-plus" (click)="openCreateModal()" raised></p-button>
  </div>

  @if (loading()) {
    <div class="flex justify-center items-center h-64">
      <i class="pi pi-spin pi-spinner text-4xl text-primary"></i>
    </div>
  } @else {
    @if (classrooms().length === 0) {
      <div class="flex flex-col items-center justify-center p-12 bg-white rounded-xl shadow-sm border border-surface-200">
         <i class="pi pi-folder-open text-6xl text-surface-300 mb-4"></i>
         <p class="text-xl text-surface-500">Nenhuma turma encontrada.</p>
      </div>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (classroom of classrooms(); track classroom.id) {
          <p-card [header]="classroom.name" styleClass="hover:shadow-lg transition-shadow duration-300">
            <div class="flex flex-col gap-4">
              <div class="flex items-center justify-between p-3 bg-surface-50 rounded-lg border border-surface-100">
                <span class="text-sm font-medium text-surface-600">Código:</span>
                <div class="flex items-center gap-2">
                  <code class="px-2 py-1 bg-primary-50 text-primary-700 font-mono font-bold rounded">{{ classroom.code }}</code>
                  <p-button icon="pi pi-copy" [rounded]="true" [text]="true" severity="secondary" 
                            (click)="copyToClipboard(classroom.code)" pTooltip="Copiar código"></p-button>
                </div>
              </div>
              
              <div class="flex justify-end mt-2">
                <p-button label="Abrir Turma" [outlined]="true" icon="pi pi-external-link" size="small"></p-button>
              </div>
            </div>
          </p-card>
        }
      </div>
    }
  }

  <!-- Professor: Create Classroom Modal -->
  <p-dialog header="Criar Nova Turma" [(visible)]="displayCreateModal" [modal]="true" [style]="{ width: '450px' }" [draggable]="false" [resizable]="false">
    <div class="flex flex-col gap-6 pt-4">
      <div class="flex flex-col gap-2">
        <label for="name" class="font-semibold text-surface-700">Nome da Turma</label>
        <input pInputText id="name" [(ngModel)]="newClassName" placeholder="Ex: Lógica de Programação A" autocomplete="off" />
      </div>
      
      <div class="flex flex-col gap-2">
        <label class="font-semibold text-surface-700">Código da Turma (Gerado Automaticamente)</label>
        <div class="flex items-center gap-2 p-3 bg-surface-50 rounded-lg border border-surface-100">
          <code class="flex-1 text-xl font-mono font-bold text-primary-700">{{ generatedCode() }}</code>
          <p-button icon="pi pi-refresh" [rounded]="true" [text]="true" (click)="generatedCode.set(classroomService.generateCode())" pTooltip="Regerar"></p-button>
          <p-button icon="pi pi-copy" [rounded]="true" [text]="true" (click)="copyToClipboard(generatedCode())" pTooltip="Copiar"></p-button>
        </div>
        <p class="text-xs text-surface-500 italic">Este é o código que seus alunos usarão para entrar na turma.</p>
      </div>

      <div class="flex justify-end gap-2 mt-4">
        <p-button label="Cancelar" severity="secondary" [text]="true" (click)="displayCreateModal.set(false)"></p-button>
        <p-button label="Criar Turma" (click)="createClassroom()"></p-button>
      </div>
    </div>
  </p-dialog>

</div>
