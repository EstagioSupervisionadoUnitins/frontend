<div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm flex flex-col gap-4 w-full">
  <div class="flex flex-col gap-1">
    <h1 class="text-2xl font-black text-slate-900 tracking-tight">{{ titulo() }}</h1>
    <p class="text-slate-500 text-sm font-medium leading-relaxed max-w-2xl">{{ descricao() }}</p>
  </div>

  <div class="flex flex-col gap-2 max-w-md">
    <div class="flex justify-between items-end">
      <span class="text-slate-900 text-sm font-bold">Seu Progresso Total</span>
      <span class="text-green-600 text-lg font-black">{{ progresso() }}%</span>
    </div>
    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
      <div 
        class="bg-green-500 h-full transition-all duration-700 ease-out rounded-full" 
        [style.width.%]="progresso()">
      </div>
    </div>
  </div>
</div>
