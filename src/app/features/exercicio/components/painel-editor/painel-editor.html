<div class="flex flex-col h-full bg-[#fffffe]">
  <!-- Editor Header Actions -->
  <div class="flex items-center justify-between p-4 border-b border-slate-200 bg-slate-50/50">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-red-400"></div>
      <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
      <div class="w-3 h-3 rounded-full bg-green-400"></div>
      <span class="ml-2 text-xs font-mono text-slate-500 font-medium">main.py</span>
    </div>

    <div class="flex gap-2">
      <button 
        class="flex items-center gap-2 px-4 py-2 text-sm font-bold rounded-lg transition-all"
        [class]="avaliando() ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-slate-800 text-white hover:bg-slate-900 shadow-md'"
        [disabled]="avaliando()"
        (click)="submeter()">
        @if (avaliando()) {
          <i class="pi pi-spin pi-spinner"></i>
          Avaliando...
        } @else {
          <i class="pi pi-play"></i>
          Enviar Solução
        }
      </button>
    </div>
  </div>

  <!-- Monaco Editor Container -->
  <div class="flex-1 relative w-full h-full min-h-0">
    <ngx-monaco-editor 
      class="absolute inset-0 w-full h-full"
      [options]="editorOptions" 
      [(ngModel)]="codigo">
    </ngx-monaco-editor>
  </div>
</div>
