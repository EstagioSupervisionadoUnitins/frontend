<!-- O layout principal ocupa toda a altura da tela, subtraindo o header se necessário -->
<div class="h-[calc(100vh-8rem)] w-full overflow-hidden bg-slate-50 border border-slate-200 rounded-xl shadow-xs">
  
  <div class="grid grid-cols-1 lg:grid-cols-[40%_1fr] h-full w-full">
    <!-- Painel de Instruções (Esquerda) -->
    <div class="h-full relative overflow-hidden">
      @if (question()) {
        <app-painel-instrucao 
          [question]="question()!"
          [feedback]="feedback()"
          [avaliando]="avaliando()">
        </app-painel-instrucao>
      } @else {
        <div class="h-full flex flex-col items-center justify-center bg-white p-12 text-center gap-4">
          <i class="pi pi-spin pi-spinner text-4xl text-primary-500"></i>
          <p class="text-slate-500 font-medium">Carregando detalhes do exercício...</p>
        </div>
      }
    </div>

    <!-- Painel do Editor de Código (Direita) -->
    <div class="h-full relative overflow-hidden shadow-[-10px_0_15px_-10px_rgba(0,0,0,0.05)]">
      <app-painel-editor
        [(codigo)]="codigoSelecionado"
        linguagem="python"
        [avaliando]="avaliando()"
        (onEnviar)="submitCodigo()">
      </app-painel-editor>
    </div>
  </div>

</div>
