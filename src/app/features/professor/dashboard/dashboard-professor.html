<div class="p-6 max-w-7xl mx-auto">
    <!-- Header com Seletor -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Dashboard do Professor</h1>
            <p class="text-gray-500">Acompanhe o desempenho das suas turmas em tempo real.</p>
        </div>

        <div class="flex items-center gap-3" *ngIf="classrooms().length > 0">
            <span class="text-sm font-medium text-gray-700">Turma:</span>
            <p-select 
                [options]="classrooms()" 
                [(ngModel)]="selectedClassroom" 
                optionLabel="name" 
                (onChange)="onClassroomChange()"
                class="w-full md:w-64"
                placeholder="Selecione uma turma">
            </p-select>
        </div>
    </div>

    <!-- Estado Vazio (Sem Turmas) -->
    <div *ngIf="!loading() && classrooms().length === 0" class="bg-white rounded-2xl p-12 text-center border-2 border-dashed border-gray-200">
        <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="pi pi-users text-4xl"></i>
        </div>
        <h2 class="text-xl font-bold text-gray-900 mb-2">Você ainda não tem turmas</h2>
        <p class="text-gray-500 mb-8 max-w-md mx-auto">
            Para visualizar o dashboard, você precisa primeiro criar uma turma e convidar seus alunos.
        </p>
        <button pButton label="Criar Minha Primeira Turma" icon="pi pi-plus" routerLink="/turmas" class="p-button-lg"></button>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading()" class="flex flex-col items-center justify-center py-20">
        <i class="pi pi-spin pi-spinner text-4xl text-blue-500 mb-4"></i>
        <p class="text-gray-500 animate-pulse">Carregando dados da turma...</p>
    </div>

    <!-- Dashboard Content -->
    <div *ngIf="!loading() && selectedClassroom" class="animate-in fade-in duration-500">
        <!-- Resumo das Métricas -->
        <app-turma-resumo [stats]="classroomStats()"></app-turma-resumo>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Coluna de Alunos e Atividade (2/3) -->
            <div class="lg:col-span-2">
                <app-alunos-lista 
                    [studentsAttention]="classroomStats()?.students_needing_attention || []"
                    [recentSubmissions]="classroomStats()?.recent_submissions || []">
                </app-alunos-lista>
            </div>

            <!-- Resumo de Trilhas (1/3) -->
            <div class="lg:col-span-1">
                <app-trilhas-resumo [playlists]="playlistStats()?.playlists_overview || []"></app-trilhas-resumo>
            </div>
        </div>
    </div>
</div>
