<div class="bg-white border border-slate-200 rounded-xl p-6 flex flex-col h-full shadow-sm">
  <div class="mb-4">
    <h3 class="text-slate-900 font-bold flex items-center gap-2 text-lg">
      <i class="pi pi-sparkles text-amber-500"></i>
      Insight da IA
    </h3>
  </div>

  <div class="flex flex-col flex-1 justify-between gap-6">
    <div class="bg-slate-50 border-l-4 border-green-600 p-5 rounded-r-lg">
      <p class="text-slate-700 text-sm leading-relaxed italic font-medium">
        "{{ insight() }}"
      </p>
    </div>

    <p-button
      label="Explorar Mini-Lição"
      icon="pi pi-arrow-right"
      iconPos="right"
      [outlined]="true"
      severity="success"
      size="small"
      styleClass="w-fit font-bold border-2 hover:bg-green-50 transition-colors">
    </p-button>
  </div>
</div>
