<div class="p-8 rounded-xl text-white relative overflow-hidden bg-linear-to-br from-green-900 via-green-800 to-green-950">
  <div class="relative z-10 flex flex-col gap-6">
    <div class="flex flex-col gap-2">
      <span class="inline-flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider w-fit">
        <i class="pi pi-book"></i>
        Módulo Atual
      </span>
      <h2 class="text-3xl font-extrabold tracking-tight">{{ progresso().tituloModulo }}</h2>
      <p class="text-white/80 text-sm max-w-2xl leading-relaxed">{{ progresso().descricaoModulo }}</p>
    </div>

    <div class="flex flex-col gap-3 max-w-md">
      <div class="flex justify-between items-end">
        <span class="text-white/60 text-xs font-medium uppercase tracking-wide">Progresso da Trilha</span>
        <span class="text-green-300 text-lg font-bold">{{ progresso().percentual }}%</span>
      </div>
      <p-progressbar
        [value]="progresso().percentual"
        [showValue]="false"
        styleClass="hero-progressbar h-2 rounded-full bg-white/15">
      </p-progressbar>
    </div>

    <p-button
      label="Continuar Trilha"
      icon="pi pi-arrow-right"
      iconPos="right"
      styleClass="w-fit px-8 py-3 bg-white text-green-900 font-bold border-none transition-transform hover:scale-105">
    </p-button>
  </div>

  <!-- Decorative background element -->
  <div class="absolute -top-1/2 -right-1/4 w-96 h-96 bg-green-500/10 rounded-full blur-3xl pointer-events-none"></div>
</div>
