<header class="bg-white border-b border-surface-200 shadow-sm sticky top-0 z-30">
  <div class="flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-3">
      @if (canShowMenu()) {
        <p-button 
          (click)="onToggleSidebar()" 
          icon="pi pi-bars" 
          [rounded]="true"
          [text]="true"
          severity="secondary"
          size="large"
          styleClass="hover:bg-surface-100"
          pTooltip="Menu"
          tooltipPosition="bottom"
          class="bg-primary-500">
        </p-button>
      }
      
      <div class="flex items-center gap-3">
        <div class="hidden md:flex flex-col">
          <span class="font-semibold text-lg text-surface-800 leading-tight italic tracking-tighter">LogikeIA</span>
        </div>
        
        @if (classroomService.activeClassroom(); as active) {
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-emerald-50 border border-emerald-100 rounded-full shadow-sm">
            <i class="pi pi-bookmark-fill text-emerald-600 text-xs"></i>
            <span class="text-xs font-bold text-emerald-700 truncate max-w-[200px]">
              {{ active.name }}
            </span>
          </div>
        }
      </div>
    </div>
    
    <div class="flex items-center gap-2">
    </div>
  </div>
</header>
