<header class="header-container bg-white/80 backdrop-blur-md border-b border-slate-100 shadow-[0_2px_15px_rgba(16,185,129,0.03)] sticky top-0 z-30 transition-all duration-300">
  <div class="flex items-center justify-between px-5 py-3">
    <div class="flex items-center gap-4">
      @if (canShowMenu()) {
        <p-button 
          (click)="onToggleSidebar()" 
          icon="pi pi-bars" 
          [rounded]="true"
          [text]="true"
          severity="secondary"
          size="large"
          styleClass="hover:bg-slate-100 !text-slate-600 transition-colors duration-200"
          pTooltip="Menu"
          tooltipPosition="bottom">
        </p-button>
      }
      
      <div class="flex items-center gap-2.5">
        <div class="flex items-center justify-center w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/20 shadow-[0_0_12px_rgba(16,185,129,0.08)]">
          <svg class="w-4.5 h-4.5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
          </svg>
        </div>
        <span class="text-xl font-black tracking-tight bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">LogikeIA</span>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
    </div>
  </div>
</header>
