<p-drawer #drawerRef [(visible)]="visible">
    <ng-template #headless>
        <div class="flex flex-col h-full">
            <div class="flex items-center justify-between px-6 pt-4 shrink-0">
                <span class="inline-flex items-center gap-2">
                    <span class="font-semibold text-2xl text-primary">Menu</span>
                </span>
                <span>
                    <p-button type="button" (click)="closeCallback($event)" icon="pi pi-times" rounded="true"
                        outlined="true" styleClass="h-8 w-8"></p-button>
                </span>
            </div>

            <div class="overflow-y-auto mt-4">
                <ul class="list-none p-2 m-0">
                        <ul class="list-none p-0 m-0">
                            @for(item of sidebarData; track $index) {
                            <li>
                                @if(item.disabled) {
                                    <div
                                        class="flex items-center p-3 mx-2 rounded-border text-surface-400 cursor-not-allowed opacity-60 relative group">
                                        <i class="{{item.icon}} mr-2 text-lg"></i>
                                        <span class="font-medium">{{item.label}}</span>
                                        <span class="ml-auto px-2 py-0.5 text-xs font-medium bg-surface-200 text-surface-500 rounded-full">
                                            Em breve
                                        </span>
                                    </div>
                                } @else {
                                    <a pRipple [routerLink]="item.routerLink" (click)="onMenuItemClick()"
                                        class="flex items-center cursor-pointer p-3 mx-2 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
                                        <i class="{{item.icon}} mr-2 text-lg"></i>
                                        <span class="font-medium">{{item.label}}</span>
                                    </a>
                                }
                            </li>
                            }
                        </ul>
                </ul>
            </div>

            @if (authService.usuario$ | async; as user) {
            <div class="mt-auto">
                <hr class="mb-4 mx-4 border-t border-0 border-surface" />
                <div
                    class="flex items-center gap-3 p-3 rounded-lg hover:bg-surface-50 cursor-pointer transition-colors">
                    <p-avatar [label]="labelForAvatarIcon()" shape="circle" styleClass="bg-primary-500 text-white"
                        size="large">
                    </p-avatar>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-surface-800 truncate">{{ user.nome }}</p>
                        <p class="text-xs text-surface-500 truncate">{{ user.email }}</p>
                        <p class="text-xs text-surface-500 truncate">{{ user.perfil.label }}</p>
                    </div>
                    <p-button (onClick)="logout()">
                        <i class="pi pi-sign-out text-surface-400 hover:text-primary-500 cursor-pointer transition-colors"
                            pTooltip="Sair" tooltipPosition="top"></i>
                    </p-button>

                </div>
            </div>
            }
        </div>
    </ng-template>
</p-drawer>
